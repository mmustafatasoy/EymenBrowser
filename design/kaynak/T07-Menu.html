<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Menü</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7ABBFF}a:hover{color:#F1F4FA}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #3E4350; font-family: Inter, Roboto, sans-serif; overflow: hidden">
  <a href="Telefon-Sayfa.dc.html" aria-label="Menüyü kapat" style="position: absolute; left: 0; right: 0; top: 0; height: 216px"></a>
  <section aria-label="Menü" style="position: absolute; left: 0; right: 0; bottom: 0; height: 628px; box-sizing: border-box; background: #121A2B; color: #F1F4FA; border-radius: 24px 24px 0 0; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #34436A; align-self: center"></div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 14px; column-gap: 4px">
      <sc-for list="{{ogeler}}" as="o" hint-placeholder-count="12">
        <a href="{{o.git}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; color: #F1F4FA; text-decoration: none; min-height: 84px">
          <span style="width: 52px; height: 52px; border-radius: 16px; background: #1B2540; display: flex; align-items: center; justify-content: center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.ikon}}"></path></svg>
          </span>
          <span style="font-size: 12.5px; line-height: 1.2; text-align: center; color: #F1F4FA">{{o.ad}}</span>
        </a>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; background: #1B2540; border-radius: 16px; padding: 4px 6px 4px 16px; min-height: 56px; box-sizing: border-box">
      <div style="flex: 1; font-size: 15px; font-weight: 500">Sayfa boyutu</div>
      <button type="button" aria-label="Küçült" onClick="{{kucult}}" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: #26324F; color: #F1F4FA; font: 500 22px Inter, sans-serif">−</button>
      <div style="width: 58px; text-align: center; font-size: 15px; font-weight: 600">%{{boyut}}</div>
      <button type="button" aria-label="Büyüt" onClick="{{buyut}}" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: #26324F; color: #F1F4FA; font: 500 22px Inter, sans-serif">+</button>
    </div>

    <div style="display: flex; flex-direction: column; margin-top: auto">
      <sc-for list="{{satirlar}}" as="s" hint-placeholder-count="3">
        <a href="{{s.git}}" style="min-height: 52px; display: flex; align-items: center; gap: 14px; color: #F1F4FA; font-size: 15px; font-weight: 500; text-decoration: none">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A9B6CF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.ikon}}"></path></svg>
          <span style="flex: 1">{{s.ad}}</span>
          <span style="font-size: 13px; font-weight: 400; color: #A9B6CF">{{s.not}}</span>
        </a>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { boyut: 100 }; }
  renderVals() {
    const i = {
      yer: 'M6 4h12v16l-6-4-6 4z',
      gecmis: 'M4 12a8 8 0 1 0 2.6-5.9M4 4v4h4M12 8v4l3 2',
      indir: 'M12 4v11M7 11l5 5 5-5M5 20h14',

      gizli: 'M3 3l18 18M10.6 5.2A9.7 9.7 0 0 1 12 5c5 0 9 4 10 7a13 13 0 0 1-2.6 3.8M6.5 6.7A13 13 0 0 0 2 12c1 3 5 7 10 7 1.8 0 3.5-.5 5-1.3',
      cevir: 'M4 6h9M8 4v2M6 6c0 4 3 7 6 8M11 6c-1 4-3 6-6 8M13 20l4-9 4 9M14.5 17h5',
      bul: 'M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0zM16 16l4 4',
      masaustu: 'M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 20h8M12 16v4',
      pdf: 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6',
      paylas: 'M12 15V4M8 8l4-4 4 4M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6',
      cihaz: 'M5 5h9a2 2 0 0 1 2 2v1M3 15V7a2 2 0 0 1 2-2M3 15h10M7 19h6M17 9h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z',
      qr: 'M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16',
      eklenti: 'M6 6h4V5a2 2 0 1 1 4 0v1h4v4h1a2 2 0 1 1 0 4h-1v4H6v-4H5a2 2 0 1 1 0-4h1z',
      ayar: 'M4 7h10M18 7h2M4 17h2M10 17h10M18 7a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM10 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0z',
      ay: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z'
    };
    const { boyut } = this.state;
    return {
      boyut,
      kucult: () => this.setState({ boyut: Math.max(50, boyut - 10) }),
      buyut: () => this.setState({ boyut: Math.min(300, boyut + 10) }),
      ogeler: [
        { ad: 'Yer imleri', ikon: i.yer, git: '#' }, { ad: 'Geçmiş', ikon: i.gecmis, git: '#' }, { ad: 'İndirmeler', ikon: i.indir, git: 'Telefon-Indirmeler.dc.html' }, { ad: 'Gizli sekme', ikon: i.gizli, git: 'Telefon-Gizli.dc.html' },
        { ad: 'Çevir', ikon: i.cevir, git: '#' }, { ad: 'Sayfada bul', ikon: i.bul, git: '#' }, { ad: 'Okuma modu', ikon: i.okuma, git: '#' }, { ad: 'Masaüstü sitesi', ikon: i.masaustu, git: '#' },
        { ad: 'PDF kaydet', ikon: i.pdf, git: '#' }, { ad: 'Paylaş', ikon: i.paylas, git: '#' }, { ad: 'Cihaza gönder', ikon: i.cihaz, git: 'Telefon-Sekmeler.dc.html' }, { ad: 'QR tara', ikon: i.qr, git: '#' }
      ],
      satirlar: [
        { ad: 'Eklentiler', not: '3 açık', ikon: i.eklenti, git: 'Telefon-Ayarlar.dc.html' },
        { ad: 'Tema', not: 'Gece', ikon: i.ay, git: 'Telefon-Gunduz.dc.html' },
        { ad: 'Ayarlar', not: '', ikon: i.ayar, git: 'Telefon-Ayarlar.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
