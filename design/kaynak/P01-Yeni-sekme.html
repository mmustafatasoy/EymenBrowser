<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Bilgisayar yeni sekme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7ABBFF}a:hover{color:#F1F4FA}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #0A0F1C; color: #F1F4FA; font-family: Inter, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px; padding: 8px 8px 0 12px; background: #0A0F1C">
    <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true" style="margin: 0 6px 8px 0"><path d="M46 10.5A26 26 0 1 0 46 53.5" fill="none" stroke="#4DA3FF" stroke-width="7" stroke-linecap="round"></path><rect x="21" y="17" width="33" height="7" rx="3.5" fill="#F1F4FA"></rect><rect x="21" y="28.5" width="24" height="7" rx="3.5" fill="#4DA3FF"></rect><rect x="21" y="40" width="33" height="7" rx="3.5" fill="#F1F4FA"></rect></svg>
    <sc-for list="{{sekmeler}}" as="s" hint-placeholder-count="4">
      <div style="height: 36px; width: 196px; max-width: 100%; box-sizing: border-box; padding: 0 6px 0 12px; border-radius: 10px 10px 0 0; background: {{s.zemin}}; display: flex; align-items: center; gap: 8px">
        <span style="width: 16px; height: 16px; border-radius: 5px; background: #34436A; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0">{{s.h}}</span>
        <span style="flex: 1; min-width: 0; font-size: 13px; color: {{s.yazi}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.ad}}</span>
        <button type="button" aria-label="{{s.kapat}}" style="width: 24px; height: 24px; border: none; border-radius: 6px; background: transparent; color: #A9B6CF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
    </sc-for>
    <button type="button" aria-label="Yeni sekme" style="width: 32px; height: 32px; margin-bottom: 2px; border: none; border-radius: 8px; background: transparent; color: #F1F4FA; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>

  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 7px 12px; background: #121A2B; border-bottom: 1px solid #26324F">
    <sc-for list="{{solArac}}" as="a" hint-placeholder-count="3">
      <button type="button" aria-label="{{a.ad}}" style="width: 36px; height: 36px; border: none; border-radius: 10px; background: transparent; color: {{a.renk}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.ikon}}"></path></svg></button>
    </sc-for>
    <label style="flex: 1 1 320px; min-width: 0; height: 36px; box-sizing: border-box; border-radius: 18px; background: #1B2540; display: flex; align-items: center; gap: 10px; padding: 0 14px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9B6CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.ara}}"></path></svg>
      <input aria-label="Adres çubuğu" placeholder="Ara veya adres yaz" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: #F1F4FA; font: 400 14px Inter, sans-serif">
    </label>
    <button type="button" aria-label="Kalkan" style="width: 36px; height: 36px; border: none; border-radius: 10px; background: transparent; color: #3DD6A3; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.kalkan}}"></path></svg></button>
    <sc-for list="{{sagArac}}" as="a" hint-placeholder-count="3">
      <button type="button" aria-label="{{a.ad}}" style="width: 36px; height: 36px; border: none; border-radius: 10px; background: transparent; color: #F1F4FA; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.ikon}}"></path></svg></button>
    </sc-for>
  </div>

  <main style="flex: 1; width: 100%; max-width: 1040px; box-sizing: border-box; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-direction: column; justify-content: center; gap: 44px">
    <div style="display: flex; flex-direction: column; gap: 28px">
      <h1 style="margin: 0; font-family: Sora, Inter, sans-serif; font-size: 44px; line-height: 1.1; font-weight: 600; letter-spacing: -1px">Nereye gidiyoruz?</h1>
      <label style="height: 60px; box-sizing: border-box; border-radius: 30px; background: #1B2540; border: 1px solid #34436A; display: flex; align-items: center; gap: 12px; padding: 0 22px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A9B6CF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.ara}}"></path></svg>
        <input aria-label="Ara" placeholder="Google'da ara" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: #F1F4FA; font: 400 18px Inter, sans-serif">
      </label>
    </div>

    <section aria-label="Kısayollar" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(96px, 100%), 1fr)); gap: 16px">
      <sc-for list="{{kisayollar}}" as="k" hint-placeholder-count="8">
        <a href="PC-Sayfa.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 4px; border-radius: 16px; color: #F1F4FA; text-decoration: none">
          <span style="width: 60px; height: 60px; border-radius: 16px; background: #1B2540; display: flex; align-items: center; justify-content: center; font-family: Sora, Inter, sans-serif; font-size: 22px; font-weight: 600">{{k.h}}</span>
          <span style="font-size: 13px; color: #A9B6CF">{{k.ad}}</span>
        </a>
      </sc-for>
    </section>

    <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px">
      <div style="background: #121A2B; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Telefonundan devam et</h2>
        <a href="PC-Sayfa.dc.html" style="color: #F1F4FA; font-size: 14px; text-decoration: none">Küçük bahçe rehberi</a>
        <a href="PC-Sayfa.dc.html" style="color: #F1F4FA; font-size: 14px; text-decoration: none">Hava durumu</a>
      </div>
      <div style="background: #121A2B; border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; gap: 14px">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3DD6A3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.kalkan}}"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 3px">
          <div style="font-size: 15px; font-weight: 600">Bu hafta 1.284 engel</div>
          <div style="font-size: 13px; color: #A9B6CF">Üç cihazında toplam</div>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const i = {
      geri: 'M15 5l-7 7 7 7',
      ileri: 'M9 5l7 7-7 7',
      yenile: 'M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5',
      ara: 'M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0zM16 16l4 4',
      kalkan: 'M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6zM9 12l2 2 4-4',
      eklenti: 'M6 6h4V5a2 2 0 1 1 4 0v1h4v4h1a2 2 0 1 1 0 4h-1v4H6v-4H5a2 2 0 1 1 0-4h1z',
      indir: 'M12 4v11M7 11l5 5 5-5M5 20h14',
      menu: 'M5 7h14M5 12h14M5 17h14'
    };
    return {
      i,
      sekmeler: [
        { h: 'Y', ad: 'Yeni sekme', zemin: '#121A2B', yazi: '#F1F4FA', kapat: 'Yeni sekmeyi kapat' },
        { h: 'K', ad: 'Küçük bahçe rehberi', zemin: 'transparent', yazi: '#A9B6CF', kapat: 'Küçük bahçe rehberini kapat' },
        { h: 'E', ad: 'Elektrik faturası', zemin: 'transparent', yazi: '#A9B6CF', kapat: 'Elektrik faturasını kapat' },
        { h: 'T', ad: 'Teklif taslağı', zemin: 'transparent', yazi: '#A9B6CF', kapat: 'Teklif taslağını kapat' }
      ],
      solArac: [
        { ad: 'Geri', ikon: i.geri, renk: '#8C9AB8' },
        { ad: 'İleri', ikon: i.ileri, renk: '#8C9AB8' },
        { ad: 'Yenile', ikon: i.yenile, renk: '#F1F4FA' }
      ],
      sagArac: [
        { ad: 'Eklentiler', ikon: i.eklenti },
        { ad: 'İndirmeler', ikon: i.indir },
        { ad: 'Menü', ikon: i.menu }
      ],
      kisayollar: [
        { h: 'H', ad: 'Haber' }, { h: 'P', ad: 'Posta' }, { h: 'V', ad: 'Video' }, { h: 'M', ad: 'Müzik' },
        { h: 'H', ad: 'Harita' }, { h: 'B', ad: 'Banka' }, { h: 'S', ad: 'Sözlük' }, { h: 'F', ad: 'Forum' }
      ]
    };
  }
}
</script>
</body>
</html>
