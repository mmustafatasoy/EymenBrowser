<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>İndirmeler</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7ABBFF}a:hover{color:#F1F4FA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0F1C; color: #F1F4FA; font-family: Inter, Roboto, sans-serif; padding: 52px 16px 24px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 4px; margin-left: -12px">
    <a href="Telefon-Menu.dc.html" aria-label="Geri" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #F1F4FA"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: Sora, Inter, sans-serif; font-size: 24px; font-weight: 600">İndirmeler</h1>
  </header>

  <div style="display: flex; gap: 8px">
    <sc-for list="{{filtreler}}" as="f" hint-placeholder-count="4">
      <button type="button" aria-pressed="{{f.secili}}" onClick="{{f.sec}}" style="{{f.stil}}">{{f.ad}}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{dosyalar}}" as="d" hint-placeholder-count="5">
      <article style="background: #121A2B; border-radius: 16px; padding: 12px 8px 12px 12px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 44px; height: 44px; border-radius: 12px; background: #1B2540; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A9B6CF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.ikon}}"></path></svg>
          </span>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.ad}}</div>
            <div style="font-size: 13px; color: {{d.renk}}">{{d.durum}}</div>
          </div>
          <sc-if value="{{d.dugme}}" hint-placeholder-val="{{ true }}">
            <button type="button" aria-label="{{d.dugmeAd}}" onClick="{{d.bas}}" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; color: #F1F4FA; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.dugmeIkon}}"></path></svg></button>
          </sc-if>
        </div>
        <sc-if value="{{d.surecte}}" hint-placeholder-val="{{ false }}">
          <div role="progressbar" aria-valuenow="{{d.yuzde}}" aria-valuemin="0" aria-valuemax="100" aria-label="{{d.ad}}" style="height: 6px; margin-right: 4px; border-radius: 3px; background: #26324F; overflow: hidden">
            <div style="height: 100%; width: {{d.genislik}}; border-radius: 3px; background: {{d.cubuk}}"></div>
          </div>
        </sc-if>
      </article>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #A9B6CF"><span>İndirilenler klasörü</span><span>2,4 GB kullanıldı</span></div>
    <button type="button" style="height: 48px; border: 1px solid #34436A; border-radius: 24px; background: transparent; color: #F1F4FA; font: 500 15px Inter, sans-serif">Tamamlananları listeden sil</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { filtre: 'Tümü', durdu: false }; }
  renderVals() {
    const { filtre, durdu } = this.state;
    const i = {
      video: 'M5 6h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM16 10l5-3v10l-5-3',
      belge: 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6',
      durdur: 'M9 5v14M15 5v14',
      oynat: 'M7 5l12 7-12 7z',
      yenile: 'M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5',
      ac: 'M9 5l7 7-7 7'
    };
    const liste = [
      { tur: 'Video', ad: 'bahce-bakimi-rehberi.mp4', ikon: i.video, surecte: true, yuzde: 62, genislik: '62%', cubuk: durdu ? '#FFB547' : '#4DA3FF', durum: durdu ? 'Duraklatıldı · 196 MB / 318 MB' : '196 MB / 318 MB · 4,2 MB/sn', renk: '#A9B6CF', dugme: true, dugmeAd: durdu ? 'Devam et' : 'Duraklat', dugmeIkon: durdu ? i.oynat : i.durdur, bas: () => this.setState({ durdu: !durdu }) },
      { tur: 'Belge', ad: 'elektrik-faturasi-ekim.pdf', ikon: i.belge, durum: '1,2 MB · Bugün 09:41', renk: '#A9B6CF', dugme: true, dugmeAd: 'Aç', dugmeIkon: i.ac },
      { tur: 'Dosya', ad: 'eymenbrowser-1.0.0-arm64.apk', ikon: i.belge, durum: '184 MB · Dün', renk: '#A9B6CF', dugme: true, dugmeAd: 'Aç', dugmeIkon: i.ac },
      { tur: 'Video', ad: 'tatil-videosu.mp4', ikon: i.video, durum: 'Bağlantı kesildi', renk: '#FF8A80', dugme: true, dugmeAd: 'Yeniden dene', dugmeIkon: i.yenile },
      { tur: 'Belge', ad: 'teklif-taslagi.docx', ikon: i.belge, durum: '38 KB · 2 Kasım', renk: '#A9B6CF', dugme: true, dugmeAd: 'Aç', dugmeIkon: i.ac }
    ];
    const cip = (s) => 'height: 44px; padding: 0 14px; border-radius: 22px; font: 500 14px Inter, sans-serif; color: ' + (s ? '#06101F' : '#F1F4FA') + '; background: ' + (s ? '#4DA3FF' : 'transparent') + '; border: ' + (s ? 'none' : '1px solid #34436A');
    return {
      filtreler: ['Tümü', 'Video', 'Belge', 'Dosya'].map((ad) => ({ ad, secili: filtre === ad, stil: cip(filtre === ad), sec: () => this.setState({ filtre: ad }) })),
      dosyalar: liste.filter((d) => filtre === 'Tümü' || d.tur === filtre)
    };
  }
}
</script>
</body>
</html>
