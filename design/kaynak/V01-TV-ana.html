<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>TV ana ekran</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F1F4FA}a:hover{color:#F1F4FA}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; background: #0A0F1C; color: #F1F4FA; font-family: Inter, Roboto, sans-serif; padding: 54px 96px; display: flex; flex-direction: column; gap: 36px; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 20px">
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><path d="M46 10.5A26 26 0 1 0 46 53.5" fill="none" stroke="#4DA3FF" stroke-width="7" stroke-linecap="round"></path><rect x="21" y="17" width="33" height="7" rx="3.5" fill="#F1F4FA"></rect><rect x="21" y="28.5" width="24" height="7" rx="3.5" fill="#4DA3FF"></rect><rect x="21" y="40" width="33" height="7" rx="3.5" fill="#F1F4FA"></rect></svg>
    <div style="flex: 1; font-family: Sora, Inter, sans-serif; font-weight: 600; font-size: 40px; letter-spacing: -0.6px">EymenBrowser</div>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 26px; color: #A9B6CF">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3DD6A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6zM9 12l2 2 4-4"></path></svg>
      Kalkan açık
    </div>
  </header>

  <a href="TV-Klavye.dc.html" style="height: 112px; box-sizing: border-box; border-radius: 56px; background: #1B2540; display: flex; align-items: center; gap: 24px; padding: 0 40px; color: #A9B6CF; font-size: 32px; text-decoration: none">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0zM16 16l4 4"></path></svg>
    Ara veya adres yaz
  </a>

  <section style="display: flex; flex-direction: column; gap: 20px">
    <h2 style="margin: 0; font-size: 32px; font-weight: 600">Kısayollar</h2>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 32px">
      <sc-for list="{{kisayollar}}" as="k" hint-placeholder-count="6">
        <a href="TV-Sayfa.dc.html" onMouseEnter="{{k.odakla}}" style="{{k.stil}}">
          <span style="font-family: Sora, Inter, sans-serif; font-size: 64px; font-weight: 600; line-height: 1">{{k.h}}</span>
          <span style="font-size: 28px; font-weight: 500">{{k.ad}}</span>
        </a>
      </sc-for>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 20px">
    <h2 style="margin: 0; font-size: 32px; font-weight: 600">Telefondan gönderilenler</h2>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px">
      <sc-for list="{{gonderilen}}" as="g" hint-placeholder-count="3">
        <a href="TV-Sayfa.dc.html" style="min-height: 156px; box-sizing: border-box; border-radius: 20px; background: #121A2B; padding: 22px 28px; display: flex; flex-direction: column; justify-content: center; gap: 6px; color: #F1F4FA; text-decoration: none">
          <span style="font-size: 28px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.ad}}</span>
          <span style="font-size: 24px; color: #A9B6CF">{{g.alt}}</span>
        </a>
      </sc-for>
    </div>
  </section>

  <footer aria-label="Kumanda tuşları" style="margin-top: auto; display: flex; gap: 48px; font-size: 24px; color: #A9B6CF">
    <sc-for list="{{tuslar}}" as="t" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="min-width: 44px; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; background: #26324F; color: #F1F4FA; font-weight: 600; font-size: 22px; display: flex; align-items: center; justify-content: center">{{t.tus}}</span>
        {{t.is}}
      </div>
    </sc-for>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { odak: 0 }; }
  renderVals() {
    const liste = [{ h: 'V', ad: 'Video' }, { h: 'M', ad: 'Müzik' }, { h: 'H', ad: 'Haber' }, { h: 'S', ad: 'Spor' }, { h: 'F', ad: 'Film' }, { h: 'Ç', ad: 'Çocuk' }];
    return {
      kisayollar: liste.map((k, n) => {
        const o = this.state.odak === n;
        return { ...k, odakla: () => this.setState({ odak: n }), stil: 'height: 240px; box-sizing: border-box; border-radius: 20px; background: ' + (o ? '#26324F' : '#1B2540') + '; color: #F1F4FA; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: transform 120ms ease-out; transform: ' + (o ? 'scale(1.06)' : 'none') + '; box-shadow: ' + (o ? '0 0 0 4px #F1F4FA' : 'none') };
      }),
      gonderilen: [
        { ad: 'Küçük bahçe rehberi', alt: 'Telefon, 10 dakika önce' },
        { ad: 'Kış filmleri listesi', alt: 'Telefon, dün' },
        { ad: 'Makarna tarifi videosu', alt: 'Tablet, dün' }
      ],
      tuslar: [{ tus: 'Tamam', is: 'Aç' }, { tus: 'Menü', is: 'Seçenekler' }, { tus: 'Geri', is: 'Çıkış' }]
    };
  }
}
</script>
</body>
</html>
