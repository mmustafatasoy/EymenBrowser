name: EymenBrowser Android tasarim ekran goruntusu denetimi
on:
  push:
    paths:
      - '.github/workflows/android-visual-audit.yml'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/MainActivity.kt'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/AndroidDownloadDenemesi.kt'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/DownloadsScreen.kt'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/ActiveDownload.kt'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/OnboardingScreens.kt'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/BrowserChrome.kt'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/LightBrowserUi.kt'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/TabOverview.kt'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/TabWorkspaceStore.kt'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/ShieldPanel.kt'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/VpnSettingsScreen.kt'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/EymenWireGuardVpn.kt'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/EymenVpnConfigStore.kt'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/SettingsScreen.kt'
      - 'android/app-telefon/src/main/AndroidManifest.xml'
      - 'android/app-telefon/build.gradle.kts'
      - 'android/core-motor/src/main/java/com/eymen/browser/motor/GeckoMotorDenemesi.kt'
      - 'android/app-telefon/src/main/assets/eymen-cosmetic/**'
      - 'tools/capture_android_visual.sh'
      - 'tools/compare_approved_screenshots.py'
      - 'shared/i18n/tr.json'
      - 'shared/i18n/en.json'
  workflow_dispatch:
concurrency:
  group: eymen-android-ui-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  emulator-visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Kurum ici tasarim karsilastirma araclarini kur
        run: python -m pip install Pillow==11.3.0
      - name: Ortak Android kaynaklarini uret
        run: python tools/generate.py
      - name: Android SDK 37 platformunu kur
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            sdkmanager --channel=3 --install "platforms;android-37.0"
          fi
      - name: Android telefon x86_64 test APK derle
        working-directory: android
        run: gradle --no-daemon :app-telefon:assembleDebug
      - name: KVM erisimini etkinlestir
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android emulatorunde ilk kurulum, yeni sekme ve T06 sistem cubugu uyumunu denetle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          # Lightweight AOSP launcher avoids Google Pixel Launcher ANR overlays.
          target: default
          arch: x86_64
          profile: Nexus 5X
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/capture_android_visual.sh
      - name: Tasarim fark raporlarini olustur
        if: success()
        run: |
          if test -s visual-captures/T02-Ilk-kurulum.png; then
            python tools/compare_approved_screenshots.py --screen T02-Ilk-kurulum --capture visual-captures/T02-Ilk-kurulum.png --output visual-report
          fi
          # T03 changed to the user-approved light design. Do not compare
          # against the previous DARK reference; capture + semantic checks
          # in capture_android_visual.sh are authoritative until the light
          # reference is checked into design/ekranlar.
      - name: Yakalanan gercek ekranlar ve fark raporlari
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EymenBrowser-Android-Real-UI-Visual-Audit-API${{ matrix.api }}
          path: |
            visual-captures/*.png
            visual-report/*.png
            visual-report/*.json
            visual-captures/*.txt
          if-no-files-found: warn
