name: EymenBrowser address and custom screens acceptance
on:
  push:
    branches: [main, fix/v1.0.21-privacy-load-acceptance, feat/free-vpn-setup, feat/tab-search, feat/bookmark-library, feat/android-finishing, feat/android-library-tools]
    paths:
      - '.github/workflows/android-browser-ui-audit.yml'
      - 'android/app-telefon/src/main/java/com/eymen/browser/telefon/**'
      - 'android/app-telefon/src/androidTest/**'
      - 'android/app-telefon/src/main/assets/licenses/**'
      - 'android/app-telefon/src/main/assets/OPEN_SOURCE_NOTICES.txt'
      - 'android/app-telefon/src/main/res/xml/browser_update_file_paths.xml'
      - 'android/app-telefon/build.gradle.kts'
      - 'design/tokens.json'
      - 'shared/i18n/**'
      - 'tools/audit_android_browser_ui.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eymen-browser-custom-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  address-custom-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.3.1'}
      - name: Generate resources and install pinned SDK
        run: |
          python tools/generate.py
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            sdkmanager --channel=3 --install "platforms;android-37.0"
          fi
      - name: Build target and separate test APK
        working-directory: android
        run: gradle --no-daemon :app-telefon:assembleDebug :app-telefon:assembleDebugAndroidTest -PeymenTestRunner=com.eymen.browser.telefon.BrowserUiInstrumentation
      - name: Release compiler memory before starting the test device
        run: |
          gradle --stop
          while read -r compiler_pid; do
            kill "$compiler_pid" || true
          done < <(jps -l | awk '$2=="org.jetbrains.kotlin.daemon.KotlinCompileDaemon" {print $1}')
          free -m
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Test actual touch and typing plus themed custom screens
        timeout-minutes: 22
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: Nexus 5X
          # Android official archive: stable 36.6.11, before observed 37.2.13 graphics failures.
          emulator-build: 15507667
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swangle -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 240
          script: timeout 1080 bash tools/audit_android_browser_ui.sh
      - name: Print failure hierarchy to the job log
        if: failure()
        run: |
          echo "::group::hierarchy.txt (visible labels)"
          grep -E "visible=true" browser-ui-audit/hierarchy.txt 2>/dev/null | grep -vE "desc=null text=( |$)" | head -300 || true
          echo "::endgroup::"
          echo "::group::chrome-diagnostics.txt"
          cat browser-ui-audit/chrome-diagnostics.txt 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::logcat tail"
          grep -E "eymen|AndroidRuntime|Toast|ActivityTaskManager" browser-ui-audit/logcat.txt 2>/dev/null | tail -120 || true
          echo "::endgroup::"
      - name: Preserve real screens and device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EymenBrowser-custom-screens-API${{ matrix.api }}
          path: browser-ui-audit/*
          if-no-files-found: warn
