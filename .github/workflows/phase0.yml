name: EymenBrowser - Android telefon arayuz ve kaynak denetimi
on:
  push:
    branches: [main, fix/v1.0.21-privacy-load-acceptance, feat/free-vpn-setup, fix/update-current-message, test/v1.0.23-update-acceptance, feat/tab-search, feat/bookmark-library, feat/android-finishing, feat/android-library-tools, feat/private-tab-lock, feat/android-dns-print, feat/android-page-tools, feat/android-sleeping-tabs, feat/android-web-notifications, feat/android-web-apps, feat/google-play-v1]
  workflow_dispatch:
env:
  PYTHONIOENCODING: utf-8
permissions:
  contents: read

jobs:
  sources:
    name: Tasarım token, metin ve bağımlılık denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ortak kaynaklardan üç platform teması ve metinleri üret
        run: python tools/generate.py
      - name: Üretilen dosyaların güncelliği
        run: python tools/generate.py --check
      - name: Şartname, sürüm ve yasak bağımlılık denetimi
        run: python tools/verify.py
      - name: Android yatay dönüş regresyon yapılandırmasını denetle
        run: python tools/check_rotation.py
      - name: DRM izin istemi ve yerelleştirme regresyon denetimi
        run: python tools/check_drm_permission.py
      - name: Android indirme akışı regresyon denetimi
        run: python tools/check_download_handling.py
      - name: Android T06 T09 sekme ve gizli oturum regresyon denetimi
        run: python tools/check_tab_sessions.py
      - name: Android T07 menu ve eylem regresyon denetimi
        run: python tools/check_menu_actions.py
      - name: T05 T08 T10 koruma indirme ayar regresyon denetimi
        run: python tools/check_stage2_features.py
      - name: Gömülü görsel reklam modülü ve gizlilik sözleşmesi
        run: |
          python tools/check_cosmetic_extension.py
          node --check android/app-telefon/src/main/assets/eymen-cosmetic/cosmetic.js
          node tools/test_cosmetic_extension.mjs
      - name: Android WireGuard izin/şifreleme/yönlendirme ve dürüst VPN durum kontratı
        run: python tools/check_vpn_contract.py
      - name: Mobil bankacilik uygulamaya yonlendirme ve GeckoView guvenlik uyumu
        run: python tools/check_banking_compat.py
      - name: Offline license integrity and scoped share-file permissions
        run: python tools/check_publishing_polish.py
      - name: Android imzali surum ve guncelleme guvenlik kontrati
        run: python tools/check_update_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: EymenBrowser-generated-themes
          path: |
            android/core-tema/src/main/java/com/eymen/browser/tema/EymenTokens.kt
            ios/EymenBrowser/Generated/EymenTokens.swift
            desktop/src/generated/tokens.css
            shared/ikon/eymen-icons.svg

  android:
    name: Android telefon GeckoView T01-T11 staged UI derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "9.3.1"}
      - run: python tools/generate.py
      - name: Android SDK kurulumunu kontrol et
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            sdkmanager --channel=3 --install "platforms;android-37.0"
          fi
      - name: Check Google Play bundle safety and manifest transformation
        run: |
          python3 tools/check_google_play_contract.py
          python3 tools/test_google_play_prep.py
          bash -n tools/build_google_play_bundle.sh
      - name: Gercek WireGuard el sikisma zaman damgasi JVM birim testleri
        working-directory: android
        run: gradle --no-daemon :app-telefon:testDebugUnitTest --stacktrace
      - name: GeckoView Android telefon APK'larini derle
        working-directory: android
        run: gradle --no-daemon :app-telefon:assembleDebug --stacktrace
      - name: Inspect pinned GeckoView public API signatures
        if: always()
        run: python tools/report_gecko_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EymenBrowser-pinned-Gecko-public-API
          path: gecko-api-report/*.txt
          if-no-files-found: warn
      - name: ABI APK dosyalarını ölç ve doğrula
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          from verify import verify, check_artifacts
          verify()
          for module in ("app-telefon",):
              files = list(Path(f"android/{module}/build/outputs/apk/debug").glob("*.apk"))
              assert len(files) == 3, f"{module}: 3 ABI APK bekleniyordu, bulunan: {len(files)}"
              for abi in ("arm64-v8a", "armeabi-v7a", "x86_64"):
                  assert any(abi in f.name for f in files), f"{module}: {abi} APK eksik"
              check_artifacts(files)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EymenBrowser-Android-Phone-Stage2-Debug
          path: android/app-telefon/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    if: github.event_name == 'workflow_dispatch'
    name: iOS 15 WKWebView motor denemesi
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen'i kur
        run: brew install xcodegen
      - name: Tema ve yerelleştirme üret
        run: python3 tools/generate.py
      - name: Xcode projesini üret
        working-directory: ios
        run: xcodegen generate
      - name: İmzasız iOS simülatör derlemesi
        working-directory: ios
        run: |
          xcodebuild -project EymenBrowser.xcodeproj -scheme EymenBrowser -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Simülatör .app dosyasını arşivle
        run: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent EymenBrowser.app EymenBrowser-iOS-Simulator.zip
          python ../../../../../tools/verify.py --artifact EymenBrowser-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EymenBrowser-Phase1-iOS-WKWebView-Simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/EymenBrowser-iOS-Simulator.zip
          if-no-files-found: error

  desktop:
    if: github.event_name == 'workflow_dispatch'
    name: Bilgisayar - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmd: dist:linux
            artifact: Linux
          - os: windows-latest
            cmd: dist:win
            artifact: Windows
          - os: macos-15
            cmd: dist:mac
            artifact: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python tools/generate.py
      - name: Pinned castLabs Electron ve React bağımlılıklarını kur
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Derle ve kurulum dosyasını üret
        working-directory: desktop
        run: npm run ${{ matrix.cmd }}
      - name: Her kurulum dosyasının boyutunu kontrol et
        shell: bash
        run: |
          python tools/verify.py
          python - <<'PY'
          import sys, pathlib
          sys.path.insert(0,"tools")
          from verify import check_artifacts
          files=[x for x in pathlib.Path("desktop/release").iterdir() if x.is_file() and x.suffix.lower() in (".exe",".dmg",".deb",".appimage")]
          assert files, "Kurulum dosyası üretilmedi"
          check_artifacts(files)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EymenBrowser-Phase1-${{ matrix.artifact }}
          path: desktop/release/*
          if-no-files-found: error
