name: EymenBrowser Android signed stable release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version (example 1.0.0)
        type: string
        required: true
        default: "1.0.15"
permissions:
  contents: write
concurrency:
  # v1 held by a stuck GitHub emulator job and blocked later runs. This v2
  # group safely isolates recovery from the stale v1 queue.
  group: eymen-browser-phone-production-release-v2
  cancel-in-progress: false
jobs:
  signed-phone-release:
    name: Verify, sign, compare old APK metadata and publish stable APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      EYMEN_ANDROID_KEYSTORE_BASE64: ${{ secrets.EYMEN_ANDROID_KEYSTORE_BASE64 }}
      EY_SIGNING_STORE_PASSWORD: ${{ secrets.EYMEN_ANDROID_STORE_PASSWORD }}
      EY_SIGNING_KEY_ALIAS: ${{ secrets.EYMEN_ANDROID_KEY_ALIAS }}
      EY_SIGNING_KEY_PASSWORD: ${{ secrets.EYMEN_ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Only release from main with a new monotonic stable tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Release must run from main"
            exit 1
          fi
          if ! [[ "$REQUESTED_VERSION" =~ ^[1-9][0-9]*\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Version must be major.minor.patch without prerelease suffixes"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$REQUESTED_VERSION"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          if ((CODE <= 1 || CODE > 2000000000)); then exit 1; fi
          TAG="v$REQUESTED_VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists: $TAG. Published tags cannot be released twice; use a NEW version (e.g. v1.0.1)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists: $TAG"
            exit 1
          fi
          echo "RELEASE_VERSION=$REQUESTED_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_CODE=$CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Install visual smoke-test dependencies
        run: python -m pip install Pillow==11.3.0
      - name: Verify project sources and update security contract
        run: |
          set -euo pipefail
          python tools/generate.py
          python tools/generate.py --check
          python tools/verify.py
          python tools/check_rotation.py
          python tools/check_drm_permission.py
          python tools/check_download_handling.py
          python tools/check_tab_sessions.py
          python tools/check_menu_actions.py
          python tools/check_stage2_features.py
          python tools/check_vpn_contract.py
          python tools/check_banking_compat.py
          python tools/check_update_contract.py
      - name: Verify that the original production signing identity is available
        run: |
          set -euo pipefail
          if [[ -z "$EYMEN_ANDROID_KEYSTORE_BASE64" ||
                -z "$EY_SIGNING_STORE_PASSWORD" ||
                -z "$EY_SIGNING_KEY_ALIAS" ||
                -z "$EY_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Configure the four EYMEN_ANDROID_* GitHub Actions secrets first"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/eymenbrowser-production.p12"
          printf '%s' "$EYMEN_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if ! keytool -list -v -keystore "$KEY_FILE" -storepass "$EY_SIGNING_STORE_PASSWORD"             -alias "$EY_SIGNING_KEY_ALIAS" > "$RUNNER_TEMP/signing-certificate.txt"; then
            echo "::error::Invalid production signing credentials"
            exit 1
          fi
          EXPECTED="$(tr -d '\r\n' < docs/ANDROID_RELEASE_CERT_SHA256.txt)"
          ACTUAL="$(grep 'SHA256:' "$RUNNER_TEMP/signing-certificate.txt" | head -1 |
            cut -d ':' -f 2- | tr -d ': ' | tr 'a-f' 'A-F')"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Signing certificate differs from the pinned original identity"
            exit 1
          fi
          echo "EY_SIGNING_KEYSTORE_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Ensure Android SDK 37 is installed
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            sdkmanager --channel=3 --install "platforms;android-37.0"
          fi
      - name: Execute JVM handshake freshness boundary tests
        working-directory: android
        run: gradle --no-daemon :app-telefon:testDebugUnitTest --stacktrace
      - name: Build 3 ABI-specific APKs signed with the original release identity
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon :app-telefon:assembleRelease             "-PeymenReleaseVersion=$RELEASE_VERSION"             "-PeymenReleaseCode=$RELEASE_CODE"
      - name: Verify signed APK packages, cert and 500 MiB upper limit
        run: |
          set -euo pipefail
          mkdir -p release-staging
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          EXPECTED="$(tr -d '\r\n' < docs/ANDROID_RELEASE_CERT_SHA256.txt)"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SOURCE="$(find android/app-telefon/build/outputs/apk/release -maxdepth 1 -type f               -name "*$ABI*-release.apk" -print -quit)"
            if [[ -z "$SOURCE" ]]; then echo "::error::Missing $ABI APK"; exit 1; fi
            TARGET="release-staging/EymenBrowser-Android-Phone-$ABI.apk"
            echo "::group::Verifying $ABI production APK"
            cp "$SOURCE" "$TARGET"
            # Gradle APK splits can differ in native-library 16 KiB alignment.
            # If alignment fails, repair it BEFORE applying the original
            # production signature; never continue with an unverified APK.
            if ! "$BUILD_TOOLS/zipalign" -c -v -P 16 4 "$TARGET"; then
              echo "Gradle APK alignment needs repair for $ABI; aligning to 16 KiB."
              ALIGNED="$RUNNER_TEMP/EymenBrowser-$ABI-aligned.apk"
              "$BUILD_TOOLS/zipalign" -P 16 -f -v 4 "$SOURCE" "$ALIGNED"
              "$BUILD_TOOLS/apksigner" sign \
                --ks "$EY_SIGNING_KEYSTORE_FILE" \
                --ks-key-alias "$EY_SIGNING_KEY_ALIAS" \
                --ks-pass env:EY_SIGNING_STORE_PASSWORD \
                --key-pass env:EY_SIGNING_KEY_PASSWORD \
                --out "$TARGET" "$ALIGNED"
              rm -f "$ALIGNED"
            fi
            if ! "$BUILD_TOOLS/zipalign" -c -v -P 16 4 "$TARGET"; then
              echo "::error::Native library alignment failed for $ABI"; exit 1
            fi
            VERIFY_LOG="$RUNNER_TEMP/$ABI-signer.txt"
            if ! "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$TARGET" > "$VERIFY_LOG" 2>&1; then
              # APK packages may be zipaligned but not correctly signed by a
              # split packaging tool. Recover only by signing again with the
              # same production identity that passed the pinned cert gate.
              echo "Gradle APK signature did not verify for $ABI; signing it using the pinned production key."
              cat "$VERIFY_LOG"
              RESIGNED="$RUNNER_TEMP/EymenBrowser-$ABI-resigned.apk"
              "$BUILD_TOOLS/apksigner" sign \
                --ks "$EY_SIGNING_KEYSTORE_FILE" \
                --ks-key-alias "$EY_SIGNING_KEY_ALIAS" \
                --ks-pass env:EY_SIGNING_STORE_PASSWORD \
                --key-pass env:EY_SIGNING_KEY_PASSWORD \
                --out "$RESIGNED" "$TARGET"
              mv "$RESIGNED" "$TARGET"
              if ! "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$TARGET" > "$VERIFY_LOG" 2>&1; then
                cat "$VERIFY_LOG"
                echo "::error::APK signature still fails after trusted re-sign for $ABI"; exit 1
              fi
            fi
            grep -E '^(Verified|Signer #1 certificate SHA-256 digest:|V[0-9]+ Signer: certificate SHA-256 digest:)' "$VERIFY_LOG" || true
            # Android SDK build-tools may print V2 Signer, V3 Signer or
            # Signer #1 for the certificate. Match the certificate digest
            # field itself, NOT a format-specific prefix or public-key hash.
            ACTUAL="$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' "$VERIFY_LOG" |
              tr 'a-f' 'A-F')"
            if [[ -z "$ACTUAL" ]]; then
              cat "$VERIFY_LOG"
              echo "::error::apksigner did not return a certificate digest for $ABI"; exit 1
            fi
            if [[ "$ACTUAL" != "$EXPECTED" ]]; then
              echo "::error::APK signing identity mismatch for $ABI"; exit 1
            fi
            echo "Verified $ABI: aligned, signed, expected certificate and release version $RELEASE_VERSION"
            echo "::endgroup::"
          done
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          from verify import check_artifacts
          files = list(Path("release-staging").glob("*.apk"))
          assert len(files) == 3
          check_artifacts(files)
          PY
          (cd release-staging && sha256sum *.apk > SHA256SUMS.txt)
      - name: Download latest published stable APK and compare signed update compatibility
        run: |
          set -euo pipefail
          mkdir -p release-staging/previous
          PREVIOUS_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          if [[ -z "$PREVIOUS_TAG" || "$PREVIOUS_TAG" == "$RELEASE_TAG" ]]; then
            echo "::error::No distinct prior stable release was found for upgrade verification"
            exit 1
          fi
          echo "Checking signed update compatibility: $PREVIOUS_TAG -> $RELEASE_TAG"
          gh release download "$PREVIOUS_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "EymenBrowser-Android-Phone-x86_64.apk" \
            --dir release-staging/previous
          test -s release-staging/previous/EymenBrowser-Android-Phone-x86_64.apk
          # GitHub emulator downloads and boot checks can hang independently
          # of the APK. Verify the *actual previous and new production files*
          # here instead, without weakening their package, signer or version.
          PREVIOUS_APK="release-staging/previous/EymenBrowser-Android-Phone-x86_64.apk"
          NEW_APK="release-staging/EymenBrowser-Android-Phone-x86_64.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          PREVIOUS_BADGING="$("$BUILD_TOOLS/aapt" dump badging "$PREVIOUS_APK" | grep -m 1 '^package:')"
          NEW_BADGING="$("$BUILD_TOOLS/aapt" dump badging "$NEW_APK" | grep -m 1 '^package:')"
          extract_package() { printf '%s\n' "$1" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p"; }
          extract_code() { printf '%s\n' "$1" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p"; }
          OLD_PACKAGE="$(extract_package "$PREVIOUS_BADGING")"
          NEW_PACKAGE="$(extract_package "$NEW_BADGING")"
          OLD_CODE="$(extract_code "$PREVIOUS_BADGING")"
          NEW_CODE="$(extract_code "$NEW_BADGING")"
          echo "Old APK: package=$OLD_PACKAGE versionCode=$OLD_CODE; new APK: package=$NEW_PACKAGE versionCode=$NEW_CODE; expected releaseCode=$RELEASE_CODE"
          if [[ "$OLD_PACKAGE" != 'com.eymen.browser.telefon' ||
                "$NEW_PACKAGE" != "$OLD_PACKAGE" ||
                -z "$OLD_CODE" || -z "$NEW_CODE" ||
                "$NEW_CODE" != "$RELEASE_CODE" ]] || (( NEW_CODE <= OLD_CODE )); then
            echo "::error::Production package/version upgrade contract failed"
            exit 1
          fi
          EXPECTED="$(tr -d '\r\n' < docs/ANDROID_RELEASE_CERT_SHA256.txt)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$PREVIOUS_APK" > "$RUNNER_TEMP/previous-apk-cert.txt"
          PREVIOUS_CERT="$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/previous-apk-cert.txt" | tr 'a-f' 'A-F')"
          if [[ -z "$PREVIOUS_CERT" || "$PREVIOUS_CERT" != "$EXPECTED" ]]; then
            echo "::error::The previously published APK is not signed by the pinned production certificate"
            exit 1
          fi
          echo "Verified old-to-new package, monotonically increasing versionCode, matching production signing certificate."
      # Runtime/emulator tests run independently in android-visual-audit.yml.
      # They are not allowed to hold a signed release hostage indefinitely
      # when an Android system image download or Quickstep launcher stalls.
      - name: Write versioned release notes without claiming unfinished features
        run: |
          cat > release-staging/RELEASE_NOTES.md <<EOF
          EYMEN Browser Android Telefon $RELEASE_TAG

          - Telefon icin GeckoView tabanli tarayici ve asama-2 arayuzleri.
          - Durum cubugu, on kamera/delik/centik ve yatay ekran kesimi icin tum tarayici ekranlarinda Android WindowInsets guvenli alan duzenlemesi.
          - Android 8-16 boyunca ayni edge-to-edge pencere yapisi; tam ekran video bu kisitlamadan bilincli olarak haric.
          - Gece/gunduz temasi icin telefon durum cubugu simge kontrasti.
          - Kullanici onayli acik renkli Eymen Browser ana sayfasi, atasoyyazilim.com sitesindeki ozgun mavi A logosu.
          - Tek ust adres/arama cubugu, yeni sekme, sekme sayaci ve sagdaki uc nokta menusunde geri/ileri/yenile.
          - YouTube, Google, Facebook, X, Instagram, WhatsApp kisayollari ve arama/baglantiya giden kategori kartlari; promosyon/reklam paneli yok.
          - Eski kurulumda koyu tema ayari kaydedilmis olsa dahi onayli acik arayuz bir kez etkinlestirilir, sonraki kullanici secimleri korunur.
          - Sag ust uc nokta menusunun boyutlari onaylanan tasarima gore kucultuldu;
            menudeki simgeler yazitipindan bagimsiz vektor haline getirildi.
          - Eymen Browser basliginda lacivert/mavi iki ton ve kavisli alt cizgi eklendi.
          - Normal Gecko sekmelerinde gercek grup olusturma, ad degistirme,
            gruba tasima ve grup silme; grup silinince sekmeler acik kalir.
          - v1.0.8: En fazla 32 normal sekmenin dogrulanmis HTTPS adresi, grup
            uyelikleri, secili sekme ve sirasi uygulama kapanip acilinca geri yuklenir.
          - Arka plan normal sekmeleri ilk secildiklerinde yuklenir; baslangicta
            tum sitelerin ayni anda acilmasi onlenir.
          - Sekme kartlarinda dogrudan GeckoView ekranindan alinmis, bellek-ici
            gercek kucuk resimler; hazir olmayan sayfalar icin notr yer tutucu.
          - Son kapatilan on normal sekmeyi art arda yeniden acma ve
            sekme kartlarindan siralama degisikligi.
          - Gizli sekmelerin URL ve kucuk resimleri kalici depoya, normal
            gruplara veya geri alma listesine aktarilmaz.
          - Kalici kayit yalnizca normal HTTPS adresleri ve gruplar icindir:
            formlar, video pozisyonlari ve Gecko geri/ileri agaci saklanmaz.
          - v1.0.9: GeckoView Standart/Siki takipci koruma listeleri ve
            kullaniciya acik koruma profili ayari; secilen profil saklanir.
          - Siteye ozel koruma istisnalari korunur; gizli oturumlardaki
            istisnalar yalniz bellek icindedir.
          - Yalnizca gercek GeckoView engelleme olaylarindan hesaplanan
            reklam takipcisi, analiz takipcisi ve diger engelleme sayilari.
          - Bilinen takipci listeleri kaynak engeller, tum reklamlarin
            engellendigi iddia edilmez.
          - v1.0.10: GeckoView'a APK icindeki EYMEN kozmetik WebExtension
            guvenli ve hataya dayanikli bicimde kaydedilir.
          - Koruma panelindeki istege bagli Beta secenegi, bilinen reklam
            kutularini yalniz CSS ile gizler; ag isteklerini durdurmaz.
          - Filtre varsayilan olarak kapalidir; modul kullanilamazsa
            dugme etkinlesmez. Site korumasi kapaliysa o siteye uygulanmaz.
          - Yerli politika: Mesajlar Gecko oturumuna, ust cerceveye ve
            dogrulanmis HTTPS siteye baglanir; gizli oturumun adresi veya
            cerez bilgileri eklentiye gonderilmez.
          - Harici reklam listesi indirme, tum reklamlari engelleme veya
            YouTube reklamlarini kaldirma bu surumde sunulmaz.
          - v1.0.11: Resmi WireGuard GoBackend ile gercek Android
            VpnService tüneli kullaniciya ait .conf ile baslatilabilir.
          - Android'in gercek VPN izin ekrani kullanilir; APK icinde VPN
            sunucusu, kullanici anahtari veya sunucu hesabi yoktur.
          - Yalniz EYMEN Browser paketine izin veren uygulama listesi,
            tam IPv4/IPv6 rotalari ve VPN DNS zorunlu kisilir.
          - Kullanici konfigurasyonu Android Keystore AES-256-GCM ile
            yedek disi ozel uygulama dosyasinda sifrelenir.
          - TUN arayuzunun acilmasi ile sunucudan alinan yakin tarihli
            WireGuard el sikismasi ayri gosterilir; sahte baglanti yoktur.
          - VPN ayarlarinda ice aktarma, baglanma, baglantiyi kesme,
            durumu yenileme ve sifreli dosyayi silme mevcuttur.
          - Dahili VPN sunucusu, otomatik yeniden baglanma ve sistem
            kill-switch saglanmaz. Fiziksel cihaz DNS/IPv6/WebRTC
            sizinti testleri henuz tamamlanmamistir.
          - v1.0.12: WireGuard sunucu handshake durumu VPN ayarlari
            acikken yaklasik 15 saniyede bir yeniden dogrulanir.
          - El sikisma 3 dakikadan eskiyse veya gelecekte gorunuyorsa
            baglanti dogrulanmis olarak gosterilmez. JVM sinir
            testleri otomatik olarak calistirilir.
          - Gercek WireGuard gelen/giden bayt sayilari ve son yanitin
            yasi gosterilir; kimlik bilgisi veya ziyaret sayfasi yoktur.
          - Baglantiyi kesme veya profili silme sonrasi gecikmeli
            eski yanitlar ekrani yanlislikla bagli yapamaz.
          - VPN profili silinince Android Keystore sifreleme anahtari
            da temizlenir; cozme hatalarinda hassas bellek sifirlanir.
          - Sistem acilisindan otomatik VPN yeniden kurma eksik oldugu
            icin Android Her zaman acik VPN bu surumde devre disidir.
          - Bu bir sistem kill-switch degildir; sunucu veya tunel
            kopunca dogrudan internet erisimi mumkundur.
          - v1.0.13: GeckoView bankalarin mobil uygulamalarina
            yonlendirebilen intent ve ozel URI tiklamalarini destekler.
          - Harici uygulama otomatik acilmaz: HTTPS kaynak ve gercek
            kullanici tiklamasi aranir, ayrica Android onayi gosterilir.
          - Web sayfasi kaynakli Intent bileşen, flag ve extras
            izinleri aktarilmaz; yalniz temiz ACTION_VIEW kullanilir.
          - Menuye Mobil uygulamada ac eklendi; kurulu bankanin
            ilgili HTTPS baglantisini desteklemesi gerekir.
          - JavaScript alert, confirm ve prompt pencereleri gercek
            site hostuyla goruntulenir; girilen sifre/kodlar kaydedilmez.
          - Banka mobil uygulamalari tarayicinin icinde calistirilmaz;
            resmi uygulama sahipligi, banka cihaz guvenligi,
            Play Integrity, biyometri ve bankaya ozel giris islemeleri
            atlatilmaz. Tum banka girislerinin calistigi iddia edilmez.
          - v1.0.14: Kullanici tiklamasiyla acilan guvenli HTTPS
            kimlik dogrulama pencereleri icin yeni GeckoSession olusturulur;
            window.open ve target blank akisi bos sekmede takilmaz.
          - Otomatik acilir pencereler reddedilir. Gizli sekmenin
            gizlilik modu korunur; normal sekme sayisi sinirlidir.
          - Baska tarayicida ac secenegi Android uygulama secicisini
            acarak resmi HTTPS web bankaciligi sayfasina gecis saglar.
          - Tarayicilar arasi sifre/cerez/oturum bilgileri aktarilmaz.
          - Banka uygulamalarinin kendi cihaz kaydi, biyometri,
            FIDO ve cihaz guvenligi testleri atlatilmaz.
            Tum bankalarin girisinin duzeldigi iddia edilmez.
          - Uygulama icinden 6 saatte bir / her acilista kontrol edilen yeni kararlı sürüm.
          - Her indirilen APK icin SHA-256, paket adi, surum kodu ve imza dogrulamasi.
          - Android kurulum izni ve son kullanici onayi gerekir; sessiz kurulum yoktur.
          - Imza anahtari ayni kaldikca sonraki imzali surumler mevcut kurulum ustune guncellenebilir.
          - Harici eklenti magazasi ve iOS/TV/PC bu Android telefon
            surumunun kapsaminda degildir. VPN icin kullanici sunucusu gerekir.

          Bu surumde statik kaynak kontrolu, derleme, orijinal uretim imzasi,
          onceki yayinlanan APK ile paket/surum/imza uyumu ve dosya checksum testleri gecilir.
          Android 15/16 emulasyon ve ekran goruntusu testleri AYRI is akisinda yapilir;
          bu yayin is akisinda emulasyon testi yapildigi iddia edilmez.
          Fiziksel cihaz regresyonu ve tum T01-T11 piksel-eslesme kabulu ayrica gereklidir.
          EOF
      - name: Publish stable GitHub Release ONLY if all previous gates succeeded
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::The release already exists; refusing a second publish"
            exit 1
          fi
          gh release create "$RELEASE_TAG"             release-staging/EymenBrowser-Android-Phone-arm64-v8a.apk             release-staging/EymenBrowser-Android-Phone-armeabi-v7a.apk             release-staging/EymenBrowser-Android-Phone-x86_64.apk             release-staging/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "EYMEN Browser Android Telefon $RELEASE_TAG"             --notes-file release-staging/RELEASE_NOTES.md             --latest
      - name: Delete temporary signing key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/eymenbrowser-production.p12"
          rm -f "$RUNNER_TEMP/signing-certificate.txt"
