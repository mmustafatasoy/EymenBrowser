name: EymenBrowser Android signed stable release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version (example 1.0.0)
        type: string
        required: true
        default: "1.0.0"
permissions:
  contents: write
concurrency:
  group: eymen-browser-phone-production-release
  cancel-in-progress: false
jobs:
  signed-phone-release:
    name: Verify, sign, emulator-test and publish stable APKs
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: production
    env:
      EYMEN_ANDROID_KEYSTORE_BASE64: ${{ secrets.EYMEN_ANDROID_KEYSTORE_BASE64 }}
      EY_SIGNING_STORE_PASSWORD: ${{ secrets.EYMEN_ANDROID_STORE_PASSWORD }}
      EY_SIGNING_KEY_ALIAS: ${{ secrets.EYMEN_ANDROID_KEY_ALIAS }}
      EY_SIGNING_KEY_PASSWORD: ${{ secrets.EYMEN_ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Only release from main with a new monotonic stable tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Release must run from main"
            exit 1
          fi
          if ! [[ "$REQUESTED_VERSION" =~ ^[1-9][0-9]*\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Version must be major.minor.patch without prerelease suffixes"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$REQUESTED_VERSION"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          if ((CODE <= 1 || CODE > 2000000000)); then exit 1; fi
          TAG="v$REQUESTED_VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists: $TAG"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists: $TAG"
            exit 1
          fi
          echo "RELEASE_VERSION=$REQUESTED_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_CODE=$CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Verify project sources and update security contract
        run: |
          set -euo pipefail
          python tools/generate.py
          python tools/generate.py --check
          python tools/verify.py
          python tools/check_rotation.py
          python tools/check_drm_permission.py
          python tools/check_download_handling.py
          python tools/check_tab_sessions.py
          python tools/check_menu_actions.py
          python tools/check_stage2_features.py
          python tools/check_update_contract.py
      - name: Verify that the original production signing identity is available
        run: |
          set -euo pipefail
          if [[ -z "$EYMEN_ANDROID_KEYSTORE_BASE64" ||
                -z "$EY_SIGNING_STORE_PASSWORD" ||
                -z "$EY_SIGNING_KEY_ALIAS" ||
                -z "$EY_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Configure the four EYMEN_ANDROID_* GitHub Actions secrets first"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/eymenbrowser-production.p12"
          printf '%s' "$EYMEN_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if ! keytool -list -v -keystore "$KEY_FILE" -storepass "$EY_SIGNING_STORE_PASSWORD"             -alias "$EY_SIGNING_KEY_ALIAS" > "$RUNNER_TEMP/signing-certificate.txt"; then
            echo "::error::Invalid production signing credentials"
            exit 1
          fi
          EXPECTED="$(tr -d '\r\n' < docs/ANDROID_RELEASE_CERT_SHA256.txt)"
          ACTUAL="$(grep 'SHA256:' "$RUNNER_TEMP/signing-certificate.txt" | head -1 |
            cut -d ':' -f 2- | tr -d ': ' | tr 'a-f' 'A-F')"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Signing certificate differs from the pinned original identity"
            exit 1
          fi
          echo "EY_SIGNING_KEYSTORE_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Ensure Android SDK 37 is installed
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            sdkmanager --channel=3 --install "platforms;android-37.0"
          fi
      - name: Build 3 ABI-specific APKs signed with the original release identity
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon :app-telefon:assembleRelease             "-PeymenReleaseVersion=$RELEASE_VERSION"             "-PeymenReleaseCode=$RELEASE_CODE"
      - name: Verify signed APK packages, cert and 500 MiB upper limit
        run: |
          set -euo pipefail
          mkdir -p release-staging
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          EXPECTED="$(tr -d '\r\n' < docs/ANDROID_RELEASE_CERT_SHA256.txt)"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SOURCE="$(find android/app-telefon/build/outputs/apk/release -maxdepth 1 -type f               -name "*$ABI*-release.apk" -print -quit)"
            if [[ -z "$SOURCE" ]]; then echo "::error::Missing $ABI APK"; exit 1; fi
            TARGET="release-staging/EymenBrowser-Android-Phone-$ABI.apk"
            echo "::group::Verifying $ABI production APK"
            cp "$SOURCE" "$TARGET"
            # Gradle APK splits can differ in native-library 16 KiB alignment.
            # If alignment fails, repair it BEFORE applying the original
            # production signature; never continue with an unverified APK.
            if ! "$BUILD_TOOLS/zipalign" -c -v -P 16 4 "$TARGET"; then
              echo "Gradle APK alignment needs repair for $ABI; aligning to 16 KiB."
              ALIGNED="$RUNNER_TEMP/EymenBrowser-$ABI-aligned.apk"
              "$BUILD_TOOLS/zipalign" -P 16 -f -v 4 "$SOURCE" "$ALIGNED"
              "$BUILD_TOOLS/apksigner" sign \
                --ks "$EY_SIGNING_KEYSTORE_FILE" \
                --ks-key-alias "$EY_SIGNING_KEY_ALIAS" \
                --ks-pass env:EY_SIGNING_STORE_PASSWORD \
                --key-pass env:EY_SIGNING_KEY_PASSWORD \
                --out "$TARGET" "$ALIGNED"
              rm -f "$ALIGNED"
            fi
            if ! "$BUILD_TOOLS/zipalign" -c -v -P 16 4 "$TARGET"; then
              echo "::error::Native library alignment failed for $ABI"; exit 1
            fi
            VERIFY_LOG="$RUNNER_TEMP/$ABI-signer.txt"
            if ! "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$TARGET" > "$VERIFY_LOG" 2>&1; then
              cat "$VERIFY_LOG"
              echo "::error::APK signature verification failed for $ABI"; exit 1
            fi
            grep -E '^(Verified|Signer #1 certificate SHA-256 digest:)' "$VERIFY_LOG" || true
            # Avoid silent CI failures when a build-tools release changes
            # formatting: detect absent fingerprints explicitly.
            ACTUAL="$(awk '/^Signer #1 certificate SHA-256 digest:/ {print $NF; exit}' "$VERIFY_LOG" |
              tr 'a-f' 'A-F')"
            if [[ -z "$ACTUAL" ]]; then
              cat "$VERIFY_LOG"
              echo "::error::apksigner did not return a certificate digest for $ABI"; exit 1
            fi
            if [[ "$ACTUAL" != "$EXPECTED" ]]; then
              echo "::error::APK signing identity mismatch for $ABI"; exit 1
            fi
            echo "Verified $ABI: aligned, signed, expected certificate and release version $RELEASE_VERSION"
            echo "::endgroup::"
          done
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          from verify import check_artifacts
          files = list(Path("release-staging").glob("*.apk"))
          assert len(files) == 3
          check_artifacts(files)
          PY
          (cd release-staging && sha256sum *.apk > SHA256SUMS.txt)
      - name: Boot and smoke-test the same signed x86_64 APK before publishing
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EY_APK_PATH: release-staging/EymenBrowser-Android-Phone-x86_64.apk
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: Nexus 5X
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/capture_android_visual.sh
      - name: Write versioned release notes without claiming unfinished features
        run: |
          cat > release-staging/RELEASE_NOTES.md <<EOF
          EYMEN Browser Android Telefon $RELEASE_TAG

          - Telefon icin GeckoView tabanli tarayici ve asama-2 arayuzleri.
          - Uygulama icinden 6 saatte bir / her acilista kontrol edilen yeni kararlı sürüm.
          - Her indirilen APK icin SHA-256, paket adi, surum kodu ve imza dogrulamasi.
          - Android kurulum izni ve son kullanici onayi gerekir; sessiz kurulum yoktur.
          - Imza anahtari ayni kaldikca sonraki imzali surumler mevcut kurulum ustune guncellenebilir.
          - VPN tuneli, tum eklentiler ve iOS/TV/PC bu Android telefon sürümünün kapsaminda degildir.

          Bu surum GitHub Actions statik, derleme ve AOSP emulator acilis testini gecti.
          Fiziksel cihaz regresyonu ve tum T01-T11 piksel-eslesme kabulu ayrica gereklidir.
          EOF
      - name: Publish stable GitHub Release ONLY if all previous gates succeeded
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG"             release-staging/EymenBrowser-Android-Phone-arm64-v8a.apk             release-staging/EymenBrowser-Android-Phone-armeabi-v7a.apk             release-staging/EymenBrowser-Android-Phone-x86_64.apk             release-staging/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "EYMEN Browser Android Telefon $RELEASE_TAG"             --notes-file release-staging/RELEASE_NOTES.md             --latest
      - name: Delete temporary signing key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/eymenbrowser-production.p12"
          rm -f "$RUNNER_TEMP/signing-certificate.txt"
