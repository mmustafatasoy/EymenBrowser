name: Publish single Android motor-test APK to Releases
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-android-motor-test.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    name: Build and publish only phone arm64 APK (not ZIP)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "9.3.1"}
      - name: Install Android API 37
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            sdkmanager --channel=3 --install "platforms;android-37.0"
          fi
      - name: Generate shared tokens and verify configuration
        run: |
          python tools/generate.py
          python tools/verify.py
          python tools/check_rotation.py
          python tools/check_drm_permission.py
          python tools/check_download_handling.py
      - name: Build phone GeckoView APK from THIS commit
        working-directory: android
        run: gradle --no-daemon :app-telefon:assembleDebug --stacktrace
      - name: Verify and select one arm64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK="android/app-telefon/build/outputs/apk/debug/app-telefon-arm64-v8a-debug.apk"
          python tools/verify.py --artifact "$APK"
          cp "$APK" release/EymenBrowser-Android-Telefon-arm64-PDF-INDIRME-TEST.apk
          sha256sum release/*.apk
          test "$(find release -name '*.apk' -type f | wc -l)" -eq 1
      - name: Publish direct APK to GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.0.1-motor-test.4"
          cat > RELEASE_NOTES.md <<'EOF'
          # EymenBrowser Android Telefon - PDF / Download Stream Test

          Android 10+ İndirilenler, Android 8/9 dosya seçicisi desteği.
          İndirme dosyası hatasında yarım kalan kayıt temizlenir.

          GeckoView PDF viewer Download düğmesinden gelen WebResponse.body
          artık Android indirme işlemine bağlanır.
          - Android 10+: Kullanıcı onayından sonra İndirilenler klasörüne
            MediaStore IS_PENDING ile kesintisiz veri akışı.
          - Android 8-9: Sistem dosya kaydetme penceresi (SAF).
          - İndirmede yeniden HTTP isteği yapılmaz, mevcut GeckoView akışı
            kullanılır. Hatalı/kısmi dosya temizlenir.
          - PDF, Widevine ve YouTube önceki motor denemeleri korunur.

          **ÖNEMLİ:** Bu sürümde yeni indirme işlemi gerçek telefonda
          henüz doğrulanmadı; test için dummy.pdf dosyasını kullanın.
          Android telefon arm64-v8a içindir, ZIP yok.
          DEBUG/TEST imzası kullanılmıştır, üretim imzalı kararlı APK değildir.
          Nihai tarayıcı ekranları şartnamedeki Kapı 1 sonrasına aittir.
          Eski test APK imzası farklı olabilir; yeniden kurulum verileri silebilir.
          EOF         if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.apk --clobber
          else
            gh release create "$TAG" release/*.apk \
              --title "EymenBrowser Android Telefon - PDF Indirme Motor Testi" \
              --target "${{ github.sha }}" \
              --notes-file RELEASE_NOTES.md --prerelease
          fi
          gh release view "$TAG" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
