name: Publish single Android motor-test APK to Releases
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-android-motor-test.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    name: Build and publish only phone arm64 APK (not ZIP)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "9.3.1"}
      - name: Install Android API 37
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            sdkmanager --channel=3 --install "platforms;android-37.0"
          fi
      - name: Generate shared tokens and verify configuration
        run: |
          python tools/generate.py
          python tools/verify.py
          python tools/check_rotation.py
      - name: Build phone GeckoView APK from THIS commit
        working-directory: android
        run: gradle --no-daemon :app-telefon:assembleDebug --stacktrace
      - name: Verify and select one arm64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK="android/app-telefon/build/outputs/apk/debug/app-telefon-arm64-v8a-debug.apk"
          python tools/verify.py --artifact "$APK"
          cp "$APK" release/EymenBrowser-Android-Telefon-arm64-ROTASYON-TEST.apk
          sha256sum release/*.apk
          test "$(find release -name '*.apk' -type f | wc -l)" -eq 1
      - name: Publish direct APK to GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.0.1-motor-test.2"
          cat > RELEASE_NOTES.md <<'EOF'
          # EymenBrowser Android Telefon — Yatay Döndürme Testi

          Bu test sürümünde video tam ekrana geçince Activity/GeckoSession korunur.
          Ekran yataya dönerken sayfanın Google'a sıfırlanmasını önlemeyi hedefler.
          Tam ekran içindeki sistem çubukları gizlenir ve telefon yatay moda geçebilir.

          **Önemli:** Bu APK yalnız arm64-v8a Android telefon içindir. ZIP yok.
          Debug imzalı motor test sürümüdür; resmi üretim imzalı sürüm değildir.
          Google girişi, DRM, bankalar ve gerçek cihazdaki yatay döndürme davranışı
          bu yeni sürümde kullanıcı tarafından henüz test edilmemiştir.
          Tasarım ekranları Kapı 1 tamamlanmadan eklenmedi.

          Eski APK ile imzalama anahtarı farklıysa güncelleme yerine kaldırıp
          yeniden kurmak gerekebilir; kaldırma uygulama verilerini siler.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.apk --clobber
          else
            gh release create "$TAG" release/*.apk \
              --title "EymenBrowser Android Telefon - Yatay Video Motor Testi" \
              --target "${{ github.sha }}" \
              --notes-file RELEASE_NOTES.md --prerelease
          fi
          gh release view "$TAG" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
